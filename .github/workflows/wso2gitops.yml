name: wso2gitops

on:
  push:
    branches: [main]
  workflow_dispatch:


env:
  PROJECT_DIR1: ItemCatalogIntegration 
  PROJECT_DIR2: ItemCatalogIntegrationService 
  IMAGE: ghcr.io/${{ github.repository_owner }}/wso2vpk
  MI_CARBONAPPS: ${MI_HOME}/repository/deployment/server/carbonapps
  MI_BASE_IMAGE: wso2/wso2mi:4.6.0-alpine
  MI_HOME: /home/wso2carbon/wso2mi-4.6.0
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------- Build the CAR file ----------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build CAR1 with Maven
        working-directory: ${{ env.PROJECT_DIR1 }}
        run: mvn -B clean install -DskipTests
      - name: Build CAR2 with Maven
        working-directory: ${{ env.PROJECT_DIR2 }}
        run: mvn -B clean install -DskipTests

      # ---------- Copy CAR into the Docker build context ----------
      - name: Copy CAR1 to carbonapps folder
        run: |
          mkdir -p carbonapps
          find "${PROJECT_DIR1}" -path "*/target/*.car" -not -path "./carbonapps/*" -exec cp {} carbonapps/ \;
          echo "CAR files to deploy:"
          ls -l carbonapps
          if [ -z "$(ls -A carbonapps/*.car 2>/dev/null)" ]; then
            echo "ERROR: No .car file found. Check the Maven build output."
            exit 1
          fi
      - name: Copy CAR2 to carbonapps folder
        run: |
          mkdir -p carbonapps
          find "${PROJECT_DIR2}" -path "*/target/*.car" -not -path "./carbonapps/*" -exec cp {} carbonapps/ \;
          echo "CAR files to deploy:"
          ls -l carbonapps
          if [ -z "$(ls -A carbonapps/*.car 2>/dev/null)" ]; then
            echo "ERROR: No .car file found. Check the Maven build output."
            exit 1
          fi
      # ---------- Build and push image ----------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.TOKEN_GITHUB }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          pull: true
          push: true
          tags: |
            ${{ env.IMAGE }}:3.0.0
            ${{ env.IMAGE }}:${{ github.sha }}
